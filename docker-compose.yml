services:
  db:
    image: postgres:15-alpine
    container_name: gathervibe_db
    environment:
      POSTGRES_USER: gathervibe_user
      POSTGRES_PASSWORD: gathervibe_pass
      POSTGRES_DB: gathervibe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gathervibe_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gathervibe_user -d gathervibe_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gathervibe_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://gathervibe_user:gathervibe_pass@db:5432/gathervibe_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gathervibe_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gathervibe_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SOCKET_URL=/api
      - NEXT_REWRITE_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gathervibe_net

volumes:
  postgres_data:

networks:
  gathervibe_net:
    driver: bridge
