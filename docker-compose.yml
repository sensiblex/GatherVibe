version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: gathervibe_db
    environment:
      POSTGRES_USER: gathervibe_user
      POSTGRES_PASSWORD: gathervibe_pass
      POSTGRES_DB: gathervibe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gathervibe_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gathervibe_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://gathervibe_user:gathervibe_pass@db:5432/gathervibe_db
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - gathervibe_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gathervibe_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gathervibe_net

volumes:
  postgres_data:

networks:
  gathervibe_net:
    driver: bridge
